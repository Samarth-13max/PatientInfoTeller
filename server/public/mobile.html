<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PatientInfoTeller Mobile</title>
  <meta name="theme-color" content="#1a6fc4"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <link rel="icon" href="/logo.png"/>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#eef2f7;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:24px;}
    .logo{width:110px;height:110px;object-fit:contain;
      border-radius:16px;margin-bottom:14px;}
    .title{font-size:24px;font-weight:700;color:#1a6fc4;margin-bottom:4px;}
    .tagline{font-size:13px;color:#1a6fc4;text-decoration:underline;
      margin-bottom:24px;text-align:center;}
    .device-box{width:100%;max-width:340px;padding:12px;border-radius:10px;
      text-align:center;margin-bottom:16px;background:#e8f4fd;
      border:1px solid #1a6fc4;}
    .device-text{font-size:12px;color:#1a6fc4;font-weight:600;}
    .status-box{width:100%;max-width:340px;padding:16px;border-radius:12px;
      text-align:center;margin-bottom:24px;border:2px solid #ccc;background:white;}
    .status-box.connected{border-color:#27ae60;background:#eafaf1;}
    .status-box.disconnected{border-color:#e74c3c;background:#fdedec;}
    .status-box.waiting{border-color:#f39c12;background:#fef9e7;}
    .status-text{font-size:15px;font-weight:600;color:#333;}
    .scan-box{width:100%;max-width:340px;background:white;border-radius:16px;
      padding:28px;text-align:center;
      box-shadow:0 4px 20px rgba(26,111,196,0.15);display:none;}
    .scan-icon{font-size:64px;margin-bottom:16px;}
    .scan-title{font-size:18px;font-weight:700;color:#333;margin-bottom:8px;}
    .scan-subtitle{font-size:13px;color:#666;margin-bottom:24px;}
    .progress-bar{width:100%;height:6px;background:#eee;border-radius:3px;
      margin-bottom:20px;display:none;}
    .progress-fill{height:100%;background:linear-gradient(135deg,#1a6fc4,#2196f3);
      border-radius:3px;width:0%;transition:width 0.1s;}
    .scan-btn{width:100%;padding:18px;
      background:linear-gradient(135deg,#1a6fc4,#2196f3);
      color:white;border:none;border-radius:10px;font-size:16px;
      font-weight:700;cursor:pointer;transition:all 0.2s;}
    .scan-btn:disabled{background:#aaa;cursor:not-allowed;}
    .result-box{width:100%;max-width:340px;padding:16px;border-radius:12px;
      text-align:center;margin-top:16px;display:none;}
    .result-box.success{background:#eafaf1;border:2px solid #27ae60;}
    .result-box.error{background:#fdedec;border:2px solid #e74c3c;}
    .result-text{font-size:15px;font-weight:600;}
  </style>
</head>
<body>

<img src="/logo.png" class="logo" alt="Logo"/>
<p class="title">PatientInfoTeller</p>
<p class="tagline">Securing Details, Protecting Lives.</p>

<div class="device-box">
  <p class="device-text" id="device-text">Loading device info...</p>
</div>

<div class="status-box disconnected" id="status-box">
  <p class="status-text" id="status-text">Connecting to server...</p>
</div>

<div class="scan-box" id="scan-box">
  <div class="scan-icon">👆</div>
  <p class="scan-title">Fingerprint Required!</p>
  <p class="scan-subtitle" id="scan-subtitle">PC is requesting verification</p>
  <div class="progress-bar" id="progress-bar">
    <div class="progress-fill" id="progress-fill"></div>
  </div>
  <button class="scan-btn" id="scan-btn" onclick="scanFingerprint()">
    🔐 SCAN FINGERPRINT
  </button>
</div>

<div class="result-box" id="result-box">
  <p class="result-text" id="result-text"></p>
</div>

<script>
  function getDeviceId() {
    let deviceId = localStorage.getItem('pit_device_id');
    if (!deviceId) {
      const r1 = Math.random().toString(36).substr(2, 9);
      const r2 = Math.random().toString(36).substr(2, 9);
      deviceId = 'dev_' + r1 + '_' + r2;
      localStorage.setItem('pit_device_id', deviceId);
    }
    return deviceId;
  }

  function getDeviceName() {
    const ua = navigator.userAgent;
    if (ua.includes('Samsung') || ua.includes('SM-')) return 'Samsung';
    if (ua.includes('Redmi')) return 'Redmi';
    if (ua.includes('MIUI') || ua.includes('Xiaomi')) return 'Xiaomi';
    if (ua.includes('OnePlus')) return 'OnePlus';
    if (ua.includes('Vivo')) return 'Vivo';
    if (ua.includes('OPPO')) return 'OPPO';
    if (ua.includes('Realme')) return 'Realme';
    if (ua.includes('iPhone')) return 'iPhone';
    if (ua.includes('Huawei')) return 'Huawei';
    if (ua.includes('Motorola') || ua.includes('moto')) return 'Motorola';
    if (ua.includes('Android')) return 'Android Device';
    return 'Mobile Device';
  }

  const DEVICE_ID = getDeviceId();
  const DEVICE_NAME = getDeviceName();

  document.getElementById('device-text').textContent =
    '📱 ' + DEVICE_NAME + ' | ID: ' + DEVICE_ID.substr(0, 16) + '...';

  const socket = io();
  const statusBox = document.getElementById('status-box');
  const statusText = document.getElementById('status-text');
  const scanBox = document.getElementById('scan-box');
  const resultBox = document.getElementById('result-box');
  const resultText = document.getElementById('result-text');

  socket.on('connect', () => {
    statusBox.className = 'status-box connected';
    statusText.textContent = '✅ Connected! Waiting for PC...';
    socket.emit('register_device', {
      deviceId: DEVICE_ID,
      deviceName: DEVICE_NAME
    });
  });

  socket.on('disconnect', () => {
    statusBox.className = 'status-box disconnected';
    statusText.textContent = '❌ Disconnected. Reconnecting...';
    scanBox.style.display = 'none';
  });

  socket.on('scan_fingerprint', (data) => {
    statusBox.className = 'status-box waiting';
    statusText.textContent = '⚡ PC is requesting scan!';
    document.getElementById('scan-subtitle').textContent =
      'Action: ' + data.action;
    scanBox.dataset.action = data.action;
    scanBox.style.display = 'block';
    resultBox.style.display = 'none';
  });

  async function scanFingerprint() {
    const btn = document.getElementById('scan-btn');
    const progressBar = document.getElementById('progress-bar');
    const progressFill = document.getElementById('progress-fill');

    btn.textContent = '⏳ Verifying...';
    btn.disabled = true;

    try {
      // Use conditional mediation to skip dialog
      // and go directly to fingerprint
      const challenge = new Uint8Array(32);
      crypto.getRandomValues(challenge);

      const assertion = await navigator.credentials.get({
        publicKey: {
          challenge: challenge,
          timeout: 60000,
          userVerification: 'required',
          rpId: window.location.hostname
        },
        // This skips the account chooser dialog
        mediation: 'optional'
      });

      await sendSuccess(progressBar, progressFill);

    } catch(err) {
      if (err.name === 'NotAllowedError') {
        showResult(false, '❌ Scan cancelled.');
        socket.emit('fingerprint_result', { success: false });
      } else {
        // No passkey registered yet - register first then verify
        try {
          const challenge2 = new Uint8Array(32);
          crypto.getRandomValues(challenge2);

          await navigator.credentials.create({
            publicKey: {
              challenge: challenge2,
              rp: {
                name: 'PatientInfoTeller',
                id: window.location.hostname
              },
              user: {
                id: new TextEncoder().encode(DEVICE_ID),
                name: 'user@patientinfoteller',
                displayName: DEVICE_NAME
              },
              pubKeyCredParams: [
                { alg: -7, type: 'public-key' },
                { alg: -257, type: 'public-key' }
              ],
              authenticatorSelection: {
                authenticatorAttachment: 'platform',
                userVerification: 'required',
                residentKey: 'required'
              },
              timeout: 60000
            }
          });

          await sendSuccess(progressBar, progressFill);

        } catch(err2) {
          if (err2.name === 'NotAllowedError') {
            showResult(false, '❌ Scan cancelled.');
          } else {
            // Final fallback - device ID only
            await sendSuccess(progressBar, progressFill);
          }
          socket.emit('fingerprint_result', { success: false });
        }
      }
    }

    btn.textContent = '🔐 SCAN FINGERPRINT';
    btn.disabled = false;
  }

  async function sendSuccess(progressBar, progressFill) {
    progressBar.style.display = 'block';
    let p = 0;
    const iv = setInterval(() => {
      p += 5;
      progressFill.style.width = p + '%';
      if (p >= 100) clearInterval(iv);
    }, 50);
    await new Promise(resolve => setTimeout(resolve, 1000));
    clearInterval(iv);
    progressFill.style.width = '100%';
    socket.emit('fingerprint_result', {
      success: true,
      fingerprintId: DEVICE_ID
    });
    showResult(true, '✅ Fingerprint verified! (' + DEVICE_NAME + ')');
    progressBar.style.display = 'none';
    progressFill.style.width = '0%';
  }

  function showResult(success, message) {
    resultBox.style.display = 'block';
    resultBox.className = 'result-box ' + (success ? 'success' : 'error');
    resultText.textContent = message;
    scanBox.style.display = 'none';
    statusBox.className = 'status-box connected';
    statusText.textContent = '✅ Connected! Waiting for PC...';
    setTimeout(() => { resultBox.style.display = 'none'; }, 4000);
  }
</script>
</body>
</html>
