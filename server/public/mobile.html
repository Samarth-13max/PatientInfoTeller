<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>PatientInfoTeller Mobile</title>
  <meta name="theme-color" content="#1a6fc4"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <link rel="icon" href="/logo.png"/>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Segoe UI',Arial,sans-serif;background:#eef2f7;
      min-height:100vh;display:flex;flex-direction:column;
      align-items:center;justify-content:center;padding:24px;}
    .logo{width:110px;height:110px;object-fit:contain;
      border-radius:16px;margin-bottom:14px;}
    .title{font-size:24px;font-weight:700;color:#1a6fc4;margin-bottom:4px;}
    .tagline{font-size:13px;color:#1a6fc4;text-decoration:underline;
      margin-bottom:32px;text-align:center;}
    .status-box{width:100%;max-width:340px;padding:16px;border-radius:12px;
      text-align:center;margin-bottom:24px;border:2px solid #ccc;background:white;}
    .status-box.connected{border-color:#27ae60;background:#eafaf1;}
    .status-box.disconnected{border-color:#e74c3c;background:#fdedec;}
    .status-box.waiting{border-color:#f39c12;background:#fef9e7;}
    .status-text{font-size:15px;font-weight:600;color:#333;}
    .scan-box{width:100%;max-width:340px;background:white;border-radius:16px;
      padding:28px;text-align:center;
      box-shadow:0 4px 20px rgba(26,111,196,0.15);display:none;}
    .scan-icon{font-size:64px;margin-bottom:16px;}
    .scan-title{font-size:18px;font-weight:700;color:#333;margin-bottom:8px;}
    .scan-subtitle{font-size:13px;color:#666;margin-bottom:24px;}
    .scan-btn{width:100%;padding:18px;
      background:linear-gradient(135deg,#1a6fc4,#2196f3);
      color:white;border:none;border-radius:10px;font-size:16px;
      font-weight:700;cursor:pointer;letter-spacing:1px;
      box-shadow:0 4px 12px rgba(26,111,196,0.3);}
    .scan-btn:active{transform:scale(0.98);}
    .scan-btn.inactive{background:#ccc;box-shadow:none;}
    .spinner{border:4px solid #f3f3f3;border-top:4px solid #1a6fc4;
      border-radius:50%;width:44px;height:44px;
      animation:spin 1s linear infinite;margin:0 auto 16px;}
    @keyframes spin{to{transform:rotate(360deg);}}
    .result-box{width:100%;max-width:340px;padding:16px;border-radius:12px;
      text-align:center;margin-top:16px;display:none;}
    .result-box.success{background:#eafaf1;border:2px solid #27ae60;}
    .result-box.error{background:#fdedec;border:2px solid #e74c3c;}
    .result-text{font-size:15px;font-weight:600;}
  </style>
</head>
<body>

<img src="/logo.png" class="logo" alt="Logo"/>
<p class="title">PatientInfoTeller</p>
<p class="tagline">Securing Details, Protecting Lives.</p>

<div class="status-box disconnected" id="status-box">
  <p class="status-text" id="status-text">Connecting to server...</p>
</div>

<div class="scan-box" id="scan-box">
  <div class="spinner" id="spinner" style="display:none"></div>
  <div class="scan-icon" id="scan-icon">👆</div>
  <p class="scan-title" id="scan-title">PC wants fingerprint!</p>
  <p class="scan-subtitle" id="scan-subtitle">Tap the button below to scan your fingerprint</p>
  <button class="scan-btn" id="scan-btn" onclick="scanFingerprint()">
    SCAN FINGERPRINT
  </button>
</div>

<div class="result-box" id="result-box">
  <p class="result-text" id="result-text"></p>
</div>

<script>
  const SERVER_URL = 'https://patientinfoteller.onrender.com';
  const socket = io(SERVER_URL);

  const statusBox = document.getElementById('status-box');
  const statusText = document.getElementById('status-text');
  const scanBox = document.getElementById('scan-box');
  const scanBtn = document.getElementById('scan-btn');
  const spinner = document.getElementById('spinner');
  const scanIcon = document.getElementById('scan-icon');
  const resultBox = document.getElementById('result-box');
  const resultText = document.getElementById('result-text');

  socket.on('connect', () => {
    statusBox.className = 'status-box connected';
    statusText.textContent = '✅ Connected! Waiting for PC...';
  });

  socket.on('disconnect', () => {
    statusBox.className = 'status-box disconnected';
    statusText.textContent = '❌ Disconnected. Reconnecting...';
    scanBox.style.display = 'none';
  });

  socket.on('scan_fingerprint', (data) => {
    statusBox.className = 'status-box waiting';
    statusText.textContent = '⚡ PC is requesting scan!';
    scanBox.style.display = 'block';
    scanIcon.style.display = 'block';
    spinner.style.display = 'none';
    scanBtn.className = 'scan-btn';
    scanBtn.textContent = 'SCAN FINGERPRINT';
    resultBox.style.display = 'none';
  });

  async function scanFingerprint() {
    if (!window.PublicKeyCredential) {
      // Fallback for devices without WebAuthn
      sendFingerprint(true);
      return;
    }

    try {
      scanBtn.className = 'scan-btn inactive';
      scanBtn.textContent = 'Scanning...';
      scanIcon.style.display = 'none';
      spinner.style.display = 'block';

      const result = await navigator.credentials.get({
        publicKey: {
          challenge: new Uint8Array(32),
          timeout: 60000,
          userVerification: 'required'
        }
      }).catch(() => null);

      if (result || await tryBiometric()) {
        sendFingerprint(true);
      } else {
        sendFingerprint(false);
      }
    } catch(err) {
      // If biometric fails, try simple confirmation
      const confirmed = confirm('Confirm fingerprint scan?');
      sendFingerprint(confirmed);
    }
  }

  async function tryBiometric() {
    try {
      const available = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
      return available;
    } catch(e) {
      return false;
    }
  }

  function sendFingerprint(success) {
    spinner.style.display = 'none';
    scanIcon.style.display = 'block';

    if (success) {
      const fingerprintId = 'fp_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      socket.emit('fingerprint_result', {
        success: true,
        fingerprintId: fingerprintId
      });
      showResult(true, '✅ Fingerprint sent successfully!');
    } else {
      socket.emit('fingerprint_result', { success: false });
      showResult(false, '❌ Scan failed. Try again.');
    }

    scanBox.style.display = 'none';
    statusBox.className = 'status-box connected';
    statusText.textContent = '✅ Connected! Waiting for PC...';
  }

  function showResult(success, message) {
    resultBox.style.display = 'block';
    resultBox.className = 'result-box ' + (success ? 'success' : 'error');
    resultText.textContent = message;
    setTimeout(() => {
      resultBox.style.display = 'none';
    }, 3000);
  }
</script>
</body>
</html>
